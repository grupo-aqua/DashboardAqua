

version: "3.8"
services:
  # ---------------------- DATABASE ----------------------
  dashboard_postgres:
    image: postgres:15
    container_name: dashboard_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Aqua1992.
      POSTGRES_DB: ventas_mv
      # Leídas de .env (raíz, gitignored) — solo las usa
      # postgres-init/01_mcp_roles_y_pg_hba.sh, que a su vez solo corre si
      # el volumen se inicializa vacío (ver ese archivo). No hardcodear acá.
      MCP_READONLY_DB_PASS: ${MCP_READONLY_DB_PASS}
      MCP_OAUTH_DB_PASS: ${MCP_OAUTH_DB_PASS}
    volumes:
      - dashboard_pgdata:/var/lib/postgresql/data
      # Solo se ejecuta si el volumen de arriba está vacío (imagen oficial
      # de Postgres) — recrea los roles mcp_readonly/mcp_oauth y las reglas
      # de pg_hba.conf que hoy solo existían en producción, sin rastro en
      # git (incidente 2026-09-17, ver TODO.md). Montado :ro por seguridad.
      - ./backend/sql/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - aqua-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------- BACKEND ----------------------
  dashboard_backend:
    build: ./backend
    container_name: dashboard_backend
    restart: always
    environment:
      DB_HOST: dashboard_postgres
      DB_USER: postgres
      DB_PASS: Aqua1992.
      DB_NAME: ventas_mv
      PORT: 5000
    depends_on:
      dashboard_postgres:
        condition: service_healthy
    networks:
      - aqua-network
    ports:
      - "5000:5000"
    volumes:
      # Logs del cron
      - ./backend/cron/cronLog:/app/cron/cronLog
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------- FRONTEND ----------------------
  dashboard_frontend:
    build: ./my-app
    container_name: dashboard_frontend
    restart: always
    networks:
      - aqua-network
    ports:
      - "3001:80"
    # healthcheck:
    #   test: ["CMD-SHELL", "wget --spider -q http://localhost || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3

  # ---------------------- MCP SERVER (ventas) ----------------------
  # Servicio separado, no comparte proceso con dashboard_backend. Sin
  # `ports:` publicado al host a propósito: solo se llega por la red docker
  # `aqua-network` (nginx-proxy-manager hace el forward por nombre de
  # contenedor, igual que con dashboard_backend/dashboard_frontend). Secretos
  # (passwords de DB, MCP_JWT_SECRET, credenciales de Google) vienen de
  # mcp-server/.env vía env_file, no inline acá, para no commitearlos.
  mcp_server:
    build:
      context: ./mcp-server
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: mcp_server
    restart: always
    env_file:
      - ./mcp-server/.env
    depends_on:
      dashboard_postgres:
        condition: service_healthy
    networks:
      - aqua-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8787/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

# ---------------------- NETWORKS ----------------------
networks:
  aqua-network:
    external: true

# ---------------------- VOLUMES -----------------------
volumes:
  dashboard_pgdata:
